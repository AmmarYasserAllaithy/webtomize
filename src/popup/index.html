<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Webtomize</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <img src="/assets/icons/ic_maintenance_128.png" alt="logo">
    <h2 class="ext-name">Webtomize</h2>
    <p>Inject style to websites, change videos playback rate, parse URLs, quick open favorite websites.</p>
  </header>


  <section class="container style">
    <h3 class="title">Automation</h3>

    <article>
      <button class="btn" id="ytpyzer" data-host="ytpyzer.netlify.app">YTPyzer</button>
    </article>
  </section>

  <section class="container style">
    <h3 class="title">Inject style</h3>

    <article>
      <button class="btn" id="poe" data-host="poe.com">Poe</button>
      <button class="btn" id="linkedin" data-host="www.linkedin.com">LinkedIn</button>
      <button class="btn" id="gemini" data-host="gemini.google.com">Gemini</button>
      <button class="btn" id="chatgpt" data-host="chatgpt.com">ChatGPT</button>
    </article>
  </section>

  <section class="container">
    <h3 class="title">Search in..</h3>

    <article>
      <button class="btn" id="brave">Brave</button>
      <button class="btn" id="gemini">Google</button>
      <button class="btn" id="duckduckgo">DuckDuckGo</button>
      <button class="btn" id="medium">Wikipedia</button>
      <button class="btn" id="stackoverflow">StackOverflow</button>
      <button class="btn" id="medium">Medium</button>
    </article>
  </section>

  <section class="container">
    <h3 class="title">Video speed</h3>

    <article>
      <p>Current speed: 1.5x</p>
      <input class="btn" type="number" placeholder="Speed up to..">
    </article>
  </section>


  <footer>
    Developed with &hearts; by Ammar Yasser
  </footer>

  <script src="script.js"></script>
</body>

</html>
